<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum Trophy Tracker</title>
    <link rel="stylesheet" href="styles/global.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Platinum Trophy Tracker</h1>
        </div>
    </header>
    
    <main class="container">
        <div class="form-group">
            <input type="text" id="gameTitle" placeholder="Enter game title">
            <input type="number" id="platinumDate" placeholder="Enter platinum date">
            <button onclick="addGame()">Add Game</button>
        </div>

        <div class="game-list" id="gameList">
            <!-- Games will be added here dynamically -->
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
